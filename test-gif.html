<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Test</title>
</head>
<body>
    <h1>GIF Generation Test</h1>
    <canvas id="testCanvas" width="200" height="200"></canvas>
    <br>
    <button onclick="testGif()">Test GIF Generation</button>
    <div id="result"></div>

    <script type="module">
        async function testGif() {
            try {
                console.log('Testing GIF generation...');
                
                // Create a simple canvas with a pattern
                const canvas = document.getElementById('testCanvas');
                const ctx = canvas.getContext('2d');
                
                // Draw a simple pattern
                ctx.fillStyle = '#F0D9B5';
                ctx.fillRect(0, 0, 100, 100);
                ctx.fillStyle = '#B58863';
                ctx.fillRect(100, 0, 100, 100);
                ctx.fillStyle = '#F0D9B5';
                ctx.fillRect(0, 100, 100, 100);
                ctx.fillStyle = '#B58863';
                ctx.fillRect(100, 100, 100, 100);
                
                // Add some text
                ctx.fillStyle = '#000000';
                ctx.font = '20px Arial';
                ctx.fillText('Test', 80, 100);
                
                // Import gifenc
                const { default: GIFEncoder } = await import('./node_modules/gifenc/dist/gifenc.esm.js');
                console.log('GIFEncoder imported successfully');
                
                // Create palette
                const palette = [
                    [240, 217, 181], // Light square
                    [181, 136, 99],  // Dark square
                    [0, 0, 0],       // Black text
                ];
                
                // Create GIF
                const gif = GIFEncoder();
                const imageData = ctx.getImageData(0, 0, 200, 200);
                const frameData = new Uint8Array(imageData.data);
                
                gif.writeFrame(frameData, 200, 200, {
                    delay: 1000,
                    palette: palette,
                    first: true
                });
                
                gif.finish();
                const result = gif.bytes();
                
                console.log('GIF created successfully! Size:', result.length, 'bytes');
                
                // Create download link
                const blob = new Blob([result], { type: 'image/gif' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = 'test.gif';
                link.textContent = 'Download Test GIF';
                link.style.display = 'block';
                link.style.marginTop = '10px';
                
                document.getElementById('result').innerHTML = `
                    <p>✅ GIF generation successful!</p>
                    <p>Size: ${result.length} bytes</p>
                `;
                document.getElementById('result').appendChild(link);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <p style="color: red;">❌ Error: ${error.message}</p>
                `;
            }
        }
        
        // Make testGif available globally
        window.testGif = testGif;
    </script>
</body>
</html>
